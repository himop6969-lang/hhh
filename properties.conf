######################### Honeygain Config #########################
# main.sh loads this file automatically when you run "sudo bash main.sh".
# Just change values below, save (Ctrl+O, Enter, Ctrl+X), and run it.

######################### Stagger Start (don't start everything at once) #########################
# Starting all instances at the same time overloads Honeygain's servers
# and causes "ping error". So we wait a bit between starting each instance.
# STAGGER_DELAY = seconds to wait after starting ONE instance before starting the next
# Still getting ping errors? Raise STAGGER_DELAY (e.g. 1 or 2).
# Want faster startup and no errors happening? Lower it (e.g. 0.2).
STAGGER_DELAY=5

######################### Devices Per Account #########################
# Max number of proxies/devices one Honeygain account can run
DEVICES_PER_ACCOUNT=10

######################### Proxy Check (test before starting) #########################
# Checks if a proxy is working before using it
CHECK_WORKING=1
CHECK_SPEED=0
MAX_LAT_MS=1500
CONNECT_TIMEOUT=5
TOTAL_TIMEOUT=12

######################### DNS Setting #########################
# DNS servers used by each instance
FORCE_NS_DNS=1
NS_DNS_LIST="1.1.1.1 8.8.8.8"

######################### UDP Traffic #########################
# BYPASS_UDP53=1 -> DNS lookups go direct through the VPS, not through the proxy
# BYPASS_ALL_UDP=1 -> ALL UDP traffic goes direct, not through the proxy
BYPASS_UDP53=1
BYPASS_ALL_UDP=0

######################### Don't touch this (advanced) #########################
FWMARK=0x22b
TUN_TABLE=100
